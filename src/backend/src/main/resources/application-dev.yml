spring:
  datasource:
    url: jdbc:h2:mem:librarydb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql

jwt:
  # ⚠️ 開発用シークレット。本番環境では必ず環境変数 JWT_SECRET で上書きすること
  secret: dev-secret-key-not-for-production-use-only-32chars

app:
  init:
    admin-password: admin123
    user-password-prefix: password

logging:
  level:
    com.example.library: DEBUG
    org.springframework.security: INFO
