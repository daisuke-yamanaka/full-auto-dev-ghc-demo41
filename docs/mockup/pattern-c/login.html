<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン — 図書管理システム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      background: linear-gradient(135deg, #fff3e0, #ffe0b2);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #333;
    }
    .login-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.15);
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo .icon { font-size: 48px; display: block; margin-bottom: 8px; }
    .login-logo h1 { font-size: 22px; font-weight: bold; color: #7B4B00; }
    .login-logo p { font-size: 13px; color: #888; margin-top: 4px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: bold; margin-bottom: 6px; color: #555; font-size: 14px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 12px 14px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 15px; font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus { outline: none; border-color: #7B4B00; box-shadow: 0 0 0 3px rgba(255,140,0,0.15); }
    .checkbox-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 20px; font-size: 14px; color: #555;
    }
    .checkbox-row input[type="checkbox"] {
      width: 18px; height: 18px; accent-color: #7B4B00; cursor: pointer;
    }
    .btn-login {
      width: 100%; padding: 13px;
      background: #ff8c00; color: #1a1a1a;
      border: none; border-radius: 8px;
      font-size: 16px; font-weight: bold;
      cursor: pointer; transition: opacity 0.2s;
    }
    .btn-login:hover { opacity: 0.85; }
    .login-footer { text-align: center; margin-top: 20px; font-size: 13px; color: #aaa; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <span class="icon">📚</span>
      <h1>図書管理システム</h1>
      <p>Library Management System</p>
    </div>
    <div class="form-group">
      <label for="userid">ユーザIDまたはメールアドレス</label>
      <input type="text" id="userid" placeholder="ユーザIDまたはメールアドレス" autocomplete="username" value="yamada.taro">
    </div>
    <div class="form-group">
      <label for="password">パスワード</label>
      <input type="password" id="password" placeholder="パスワード" autocomplete="current-password" value="••••••••">
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="admin-login">
      <label for="admin-login" style="margin:0;font-weight:normal;">管理者としてログイン</label>
    </div>
    <button class="btn-login" onclick="location.href='home.html'">ログイン</button>
    <div class="login-footer">
      <p>パスワードを忘れた方は管理者にお問い合わせください。</p>
    </div>
  </div>
</body>
</html>
