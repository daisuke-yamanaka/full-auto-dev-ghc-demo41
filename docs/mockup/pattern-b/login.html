<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>図書管理システム - ログイン</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body {
      font-family: 'Noto Sans JP', 'Roboto', sans-serif;
      background: #f8f9fa;
      color: #202124;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 16px;
    }
    .login-card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.24);
      padding: 40px 40px 32px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-logo svg {
      width: 56px;
      height: 56px;
      margin-bottom: 12px;
    }
    .login-logo h1 {
      font-size: 1.375rem;
      font-weight: 500;
      color: #202124;
    }
    .login-logo p {
      font-size: 0.8125rem;
      color: #5f6368;
      margin-top: 4px;
    }
    .error-message {
      background: #fce8e6;
      border: 1px solid #f28b82;
      border-radius: 4px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 0.8125rem;
      color: #c5221f;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: #202124;
      margin-bottom: 6px;
    }
    .form-label .required { color: #d93025; margin-left: 4px; }
    .input-wrapper { position: relative; }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 0.875rem;
      color: #202124;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #fff;
      font-family: inherit;
    }
    .form-control:focus {
      outline: none;
      border-color: #1a73e8;
      box-shadow: 0 0 0 2px rgba(26,115,232,.2);
    }
    .form-control.password-field { padding-right: 44px; }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #5f6368;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
    }
    .toggle-password:hover { color: #202124; }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 24px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-size: 0.9375rem;
      font-weight: 500;
      background: #1a73e8;
      color: #fff;
      transition: background 0.15s, box-shadow 0.15s;
      font-family: inherit;
    }
    .btn-primary:hover {
      background: #1557b0;
      box-shadow: 0 2px 6px rgba(26,115,232,.4);
    }
    .help-text {
      margin-top: 20px;
      text-align: center;
      font-size: 0.8125rem;
      color: #5f6368;
    }
    .divider {
      height: 1px;
      background: #dadce0;
      margin: 24px 0;
    }
    .quick-login {
      font-size: 0.75rem;
      color: #5f6368;
      text-align: center;
      margin-bottom: 8px;
    }
    .quick-link {
      display: block;
      text-align: center;
      font-size: 0.8125rem;
      color: #1a73e8;
      text-decoration: none;
      padding: 8px;
      border-radius: 4px;
      transition: background 0.15s;
    }
    .quick-link:hover { background: #e8f0fe; }
    @media (max-width: 480px) {
      .login-card { padding: 32px 24px 24px; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="2" y="3" width="16" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/>
          <rect x="6" y="3" width="16" height="18" rx="2" fill="#fff" stroke="#1a73e8" stroke-width="1.5"/>
          <line x1="10" y1="8" x2="18" y2="8" stroke="#1a73e8" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="10" y1="12" x2="18" y2="12" stroke="#1a73e8" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="10" y1="16" x2="15" y2="16" stroke="#1a73e8" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <h1>図書管理システム</h1>
        <p>アカウントにサインインしてください</p>
      </div>

      <div class="error-message" id="errorMessage" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        ユーザIDまたはパスワードが正しくありません
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="userId">
            ユーザID / メールアドレス<span class="required">*</span>
          </label>
          <input
            type="text"
            id="userId"
            class="form-control"
            placeholder="例: u001 または user@example.jp"
            value="yamada@example.jp"
            required
            aria-required="true"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            パスワード<span class="required">*</span>
          </label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              class="form-control password-field"
              placeholder="パスワードを入力"
              value="password123"
              required
              aria-required="true"
            >
            <button type="button" class="toggle-password" onclick="togglePwd('password', this)" aria-label="パスワード表示切替">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary">
          ログイン
        </button>
      </form>

      <div class="divider"></div>

      <p class="quick-login">デモ用クイックログイン</p>
      <a href="activity.html" class="quick-link">→ ログインしてアクティビティフィードへ</a>

      <p class="help-text" style="margin-top: 16px;">
        パスワードを忘れた場合は管理者にお問い合わせください
      </p>
    </div>
  </div>

  <script>
    function togglePwd(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const isHidden = field.type === 'password';
      field.type = isHidden ? 'text' : 'password';
      btn.innerHTML = isHidden
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    }

    function handleLogin(e) {
      e.preventDefault();
      const userId = document.getElementById('userId').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('errorMessage');

      if (!userId || !password) {
        errorEl.style.display = 'flex';
        return;
      }

      // ダミー認証: 何か入力があればログイン成功
      if (password.length >= 1) {
        window.location.href = 'activity.html';
      } else {
        errorEl.style.display = 'flex';
      }
    }
  </script>
</body>
</html>
