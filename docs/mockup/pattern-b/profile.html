<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>図書管理システム - プロフィール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body { font-family: 'Noto Sans JP','Roboto',sans-serif; background: #f8f9fa; color: #202124; min-height: 100vh; }
    .app-header { position: fixed; top: 0; left: 0; right: 0; height: 64px; background: #fff; border-bottom: 1px solid #dadce0; border-left: 4px solid #1a73e8; display: flex; align-items: center; padding: 0 16px; z-index: 100; box-shadow: 0 2px 4px rgba(0,0,0,.08); transition: left .3s; }
    .app-header.drawer-pinned { left: 280px; }
    .header-title { font-size: 1.25rem; font-weight: 500; margin-left: 8px; }
    .header-spacer { flex: 1; }
    .header-btn { background: none; border: none; cursor: pointer; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #5f6368; margin: 0 4px; }
    .header-btn:hover { background: #f1f3f4; }
    .badge { position: absolute; top: 6px; right: 6px; background: #d93025; color: white; font-size: 10px; width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .avatar { background: #1a73e8; color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; }
    .drawer-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.32); z-index: 150; }
    .drawer-overlay.show { display: block; }
    .drawer { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; background: #fff; z-index: 200; display: flex; flex-direction: column; transition: left .3s, box-shadow .3s; overflow-y: auto; }
    .drawer.open { left: 0; box-shadow: 4px 0 12px rgba(0,0,0,.15); }
    .drawer.pinned { box-shadow: none; border-right: 1px solid #dadce0; }
    .drawer-header { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #dadce0; flex-shrink: 0; }
    .drawer-logo { display: flex; align-items: center; gap: 12px; font-size: 1rem; font-weight: 600; }
    .pin-btn { background: none; border: none; cursor: pointer; font-size: 16px; opacity: .5; padding: 4px; border-radius: 4px; display: none; }
    .pin-btn:hover { opacity: 1; background: #f1f3f4; }
    .pin-btn.active { opacity: 1; color: #1a73e8; }
    @media (min-width: 1024px) { .pin-btn { display: flex; } }
    .drawer-user { display: flex; align-items: center; gap: 12px; padding: 16px; flex-shrink: 0; }
    .drawer-avatar { background: #1a73e8; color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; flex-shrink: 0; }
    .drawer-user-name { font-weight: 500; font-size: .875rem; }
    .drawer-user-role { font-size: .75rem; color: #5f6368; }
    .drawer-divider { height: 1px; background: #dadce0; margin: 4px 0; flex-shrink: 0; }
    .drawer-section-label { padding: 8px 16px 4px; font-size: .75rem; font-weight: 500; color: #5f6368; text-transform: uppercase; letter-spacing: .05em; }
    .drawer-nav { padding: 4px 0; }
    .drawer-item { display: flex; align-items: center; gap: 16px; padding: 12px 16px; color: #202124; text-decoration: none; font-size: .875rem; border-radius: 0 24px 24px 0; margin-right: 8px; transition: background .15s; }
    .drawer-item:hover { background: #f1f3f4; }
    .drawer-item.active { background: #e8f0fe; color: #1a73e8; font-weight: 500; }
    .drawer-logout { color: #d93025; }
    .drawer-font-size { padding: 8px 16px 16px; }
    .font-size-btns { display: flex; gap: 8px; margin-top: 8px; }
    .font-btn { flex: 1; padding: 6px 4px; border: 1px solid #dadce0; border-radius: 4px; background: white; color: #5f6368; cursor: pointer; font-size: .75rem; font-family: inherit; }
    .font-btn.active { background: #e8f0fe; border-color: #1a73e8; color: #1a73e8; font-weight: 500; }
    .main-content { margin-top: 64px; padding: 24px; min-height: calc(100vh - 64px); transition: margin-left .3s; max-width: 720px; }
    .main-content.drawer-pinned { margin-left: 280px; }
    .snackbar { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #323232; color: #fff; border-radius: 4px; padding: 12px 24px; font-size: .875rem; z-index: 9999; opacity: 0; transition: all .3s; white-space: nowrap; }
    .snackbar.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .page-title { font-size: 1.5rem; font-weight: 400; margin-bottom: 24px; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.24); padding: 24px; margin-bottom: 16px; }
    .card-title { font-size: 1rem; font-weight: 500; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    /* プロフィールヘッダー */
    .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #dadce0; }
    .profile-avatar { width: 72px; height: 72px; border-radius: 50%; background: #1a73e8; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 500; flex-shrink: 0; }
    .profile-name { font-size: 1.25rem; font-weight: 500; }
    .profile-role { font-size: .875rem; color: #5f6368; margin-top: 4px; }
    .profile-id { font-size: .8125rem; color: #5f6368; margin-top: 2px; }
    /* フォーム */
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: .875rem; font-weight: 500; color: #202124; margin-bottom: 6px; }
    .form-label .required { color: #d93025; margin-left: 4px; }
    .form-control { width: 100%; padding: 10px 12px; border: 1px solid #dadce0; border-radius: 4px; font-size: .875rem; color: #202124; font-family: inherit; background: #fff; transition: border-color .15s; }
    .form-control:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.2); }
    .form-control[readonly] { background: #f8f9fa; color: #5f6368; }
    .form-help { font-size: .75rem; color: #5f6368; margin-top: 4px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 24px; border-radius: 4px; border: none; cursor: pointer; font-size: .875rem; font-weight: 500; text-decoration: none; transition: background .15s; font-family: inherit; }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-primary:hover { background: #1557b0; }
    .btn-outline { background: transparent; border: 1px solid #1a73e8; color: #1a73e8; }
    .btn-outline:hover { background: #e8f0fe; }
    /* フォントサイズセクション */
    .font-size-section { padding: 16px; background: #f8f9fa; border-radius: 8px; }
    .font-size-grid { display: flex; gap: 12px; margin-top: 12px; }
    .font-size-option { flex: 1; padding: 12px; border: 2px solid #dadce0; border-radius: 8px; text-align: center; cursor: pointer; background: white; transition: all .15s; }
    .font-size-option:hover { border-color: #1a73e8; background: #e8f0fe; }
    .font-size-option.active { border-color: #1a73e8; background: #e8f0fe; color: #1a73e8; }
    .font-size-option .size-label { font-weight: 500; display: block; margin-top: 4px; font-size: .75rem; }
    .divider-section { border-top: 1px solid #dadce0; padding-top: 16px; margin-top: 16px; }
    @media (max-width: 599px) { .main-content { padding: 16px; } .profile-header { flex-direction: column; text-align: center; } }
  </style>
</head>
<body>
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <nav class="drawer" id="drawer" role="navigation" aria-label="メインナビゲーション">
    <div class="drawer-header">
      <div class="drawer-logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="14" height="18" rx="2" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.5"/><rect x="6" y="3" width="14" height="18" rx="2" fill="#fff" stroke="#1a73e8" stroke-width="1.5"/><line x1="10" y1="8" x2="16" y2="8" stroke="#1a73e8" stroke-width="1.5" stroke-linecap="round"/><line x1="10" y1="12" x2="16" y2="12" stroke="#1a73e8" stroke-width="1.5" stroke-linecap="round"/></svg><span>図書管理</span></div>
      <button class="pin-btn" id="pinBtn" onclick="togglePin()" aria-label="ドロワーを固定">📌</button>
    </div>
    <div class="drawer-user"><div class="drawer-avatar">山田</div><div><div class="drawer-user-name">山田 太郎</div><div class="drawer-user-role">一般ユーザ</div></div></div>
    <div class="drawer-divider"></div>
    <nav class="drawer-nav">
      <a href="activity.html" class="drawer-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>アクティビティ</a>
      <a href="dashboard.html" class="drawer-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>ダッシュボード</a>
      <a href="books.html" class="drawer-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>図書を探す</a>
      <a href="loan-history.html" class="drawer-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>貸出履歴</a>
      <a href="reservations.html" class="drawer-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>予約一覧</a>
    </nav>
    <div class="drawer-divider"></div>
    <div class="drawer-section-label">管理者メニュー</div>
    <nav class="drawer-nav">
      <a href="book-management.html" class="drawer-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="12" y1="7" x2="12" y2="13"/><line x1="9" y1="10" x2="15" y2="10"/></svg>図書管理</a>
      <a href="user-management.html" class="drawer-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>ユーザ管理</a>
    </nav>
    <div class="drawer-divider"></div>
    <div class="drawer-font-size"><div class="drawer-section-label">文字サイズ</div><div class="font-size-btns"><button onclick="setFontSize('normal')" class="font-btn active">標準</button><button onclick="setFontSize('large')" class="font-btn">大</button><button onclick="setFontSize('xlarge')" class="font-btn">特大</button></div></div>
    <div style="flex:1"></div>
    <div class="drawer-divider"></div>
    <nav class="drawer-nav" style="padding-bottom:8px"><a href="login.html" class="drawer-item drawer-logout"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>ログアウト</a></nav>
  </nav>

  <header class="app-header" id="appHeader" role="banner">
    <button class="header-btn" onclick="toggleDrawer()" aria-label="メニュー"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
    <span class="header-title">図書管理システム</span>
    <div class="header-spacer"></div>
    <button class="header-btn" onclick="window.location.href='books.html'" aria-label="検索"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
    <button class="header-btn" style="position:relative" aria-label="通知"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="badge">3</span></button>
    <button class="header-btn" onclick="window.location.href='profile.html'" aria-label="プロフィール"><div class="avatar">山田</div></button>
  </header>

  <main class="main-content" id="mainContent" role="main">
    <h1 class="page-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2" style="vertical-align:middle;margin-right:8px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      プロフィール
    </h1>

    <!-- プロフィールカード -->
    <div class="card">
      <div class="profile-header">
        <div class="profile-avatar">山田</div>
        <div>
          <div class="profile-name">山田 太郎</div>
          <div class="profile-role">一般ユーザ</div>
          <div class="profile-id">ユーザID: u001</div>
        </div>
      </div>

      <form onsubmit="handleSave(event)">
        <div class="form-group">
          <label class="form-label" for="displayName">表示名<span class="required">*</span></label>
          <input type="text" id="displayName" class="form-control" value="山田 太郎" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">メールアドレス</label>
          <input type="email" id="email" class="form-control" value="yamada@example.jp" readonly>
          <p class="form-help">メールアドレスの変更は管理者にお問い合わせください</p>
        </div>
        <div style="display:flex;justify-content:flex-end;">
          <button type="submit" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            保存する
          </button>
        </div>
      </form>
    </div>

    <!-- フォントサイズ設定カード -->
    <div class="card">
      <div class="card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        表示設定
      </div>
      <div class="font-size-section">
        <p style="font-size:.875rem;color:#5f6368;">文字サイズ</p>
        <div class="font-size-grid">
          <button class="font-size-option active" id="fso-normal" onclick="selectFontSize('normal')" aria-pressed="true">
            <span style="font-size:1rem;">あ</span>
            <span class="size-label">標準</span>
          </button>
          <button class="font-size-option" id="fso-large" onclick="selectFontSize('large')" aria-pressed="false">
            <span style="font-size:1.25rem;">あ</span>
            <span class="size-label">大</span>
          </button>
          <button class="font-size-option" id="fso-xlarge" onclick="selectFontSize('xlarge')" aria-pressed="false">
            <span style="font-size:1.5rem;">あ</span>
            <span class="size-label">特大</span>
          </button>
        </div>
      </div>
    </div>

    <!-- パスワード変更カード -->
    <div class="card">
      <div class="card-title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a73e8" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        セキュリティ
      </div>
      <p style="font-size:.875rem;color:#5f6368;margin-bottom:16px;">定期的なパスワード変更をお勧めします。</p>
      <a href="password.html" class="btn btn-outline">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        パスワードを変更する
      </a>
    </div>
  </main>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>

  <script>
    let isDrawerOpen = false, isPinned = false;
    function initDrawer() { if (window.innerWidth >= 1024 && localStorage.getItem('drawerPinned') === 'true') setPinned(true); }
    function toggleDrawer() { if (isPinned) { setPinned(false); return; } isDrawerOpen ? closeDrawer() : openDrawer(); }
    function openDrawer() { isDrawerOpen = true; document.getElementById('drawer').classList.add('open'); if (!isPinned) document.getElementById('drawerOverlay').classList.add('show'); }
    function closeDrawer() { if (isPinned) return; isDrawerOpen = false; document.getElementById('drawer').classList.remove('open'); document.getElementById('drawerOverlay').classList.remove('show'); }
    function togglePin() { setPinned(!isPinned); }
    function setPinned(pinned) {
      isPinned = pinned; localStorage.setItem('drawerPinned', pinned);
      const d=document.getElementById('drawer'),c=document.getElementById('mainContent'),h=document.getElementById('appHeader'),o=document.getElementById('drawerOverlay'),pb=document.getElementById('pinBtn');
      if(pinned){isDrawerOpen=true;d.classList.add('open','pinned');o.classList.remove('show');c.classList.add('drawer-pinned');h.classList.add('drawer-pinned');if(pb)pb.classList.add('active');}
      else{isDrawerOpen=false;d.classList.remove('open','pinned');c.classList.remove('drawer-pinned');h.classList.remove('drawer-pinned');if(pb)pb.classList.remove('active');}
    }
    function showSnackbar(msg,dur=3000){const s=document.getElementById('snackbar');s.textContent=msg;s.classList.add('show');setTimeout(()=>s.classList.remove('show'),dur);}
    function setFontSize(size){const sz={normal:'14px',large:'16px',xlarge:'18px'};document.documentElement.style.fontSize=sz[size]||'14px';localStorage.setItem('fontSize',size);document.querySelectorAll('.font-btn').forEach(b=>b.classList.remove('active'));const b=document.querySelector(`.font-btn[onclick="setFontSize('${size}')"]`);if(b)b.classList.add('active');}
    function initFontSize(){const saved=localStorage.getItem('fontSize')||'normal';setFontSize(saved);selectFontSize(saved,false);}
    function selectFontSize(size, showNotice=true) {
      setFontSize(size);
      ['normal','large','xlarge'].forEach(s => {
        const el = document.getElementById('fso-'+s);
        if (el) { el.classList.toggle('active', s === size); el.setAttribute('aria-pressed', s === size); }
      });
      if (showNotice) showSnackbar('文字サイズを変更しました');
    }
    function handleSave(e) { e.preventDefault(); showSnackbar('プロフィールを保存しました'); }
    window.addEventListener('load',()=>{initDrawer();initFontSize();});
    window.addEventListener('resize',()=>{if(window.innerWidth<1024&&isPinned)setPinned(false);});
  </script>
</body>
</html>
