<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - LibraryMS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #0078d4;
      --primary-dark: #005a9e;
      --primary-light: #deecf9;
      --text-primary: #323130;
      --text-secondary: #605e5c;
      --border-color: #edebe9;
      --white: #ffffff;
      --danger: #a4262c;
    }
    body {
      font-family: 'Segoe UI', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #deecf9 0%, #f3f2f1 50%, #e8f4fd 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
    }
    .login-wrapper {
      width: 100%;
      max-width: 440px;
      padding: 16px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-logo .logo-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 8px;
    }
    .login-logo .app-name {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }
    .login-logo .app-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .login-card {
      background: var(--white);
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10), 0 1px 4px rgba(0,0,0,0.06);
      padding: 40px;
    }
    .login-card h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .login-card .login-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      height: 40px;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #8a8886;
      border-radius: 4px;
      color: var(--text-primary);
      background: var(--white);
      transition: border-color 0.15s;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(0,120,212,0.2);
    }
    .password-wrapper {
      position: relative;
    }
    .password-wrapper .form-control {
      padding-right: 44px;
    }
    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 16px;
      padding: 4px;
      line-height: 1;
    }
    .password-toggle:focus {
      outline: 2px solid var(--primary);
      border-radius: 2px;
    }
    .btn-primary {
      width: 100%;
      height: 40px;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:focus { outline: 2px solid var(--primary-dark); outline-offset: 2px; }
    .forgot-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
    }
    .forgot-link:hover { text-decoration: underline; }
    .forgot-link:focus { outline: 2px solid var(--primary); border-radius: 2px; }
    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    /* Demo note */
    .demo-note {
      background: var(--primary-light);
      border: 1px solid var(--primary);
      border-radius: 4px;
      padding: 10px 14px;
      margin-top: 20px;
      font-size: 12px;
      color: var(--primary-dark);
    }
    .demo-note strong { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-logo">
      <span class="logo-icon" aria-hidden="true">📚</span>
      <div class="app-name">LibraryMS</div>
      <div class="app-subtitle">図書管理システム</div>
    </div>

    <div class="login-card">
      <h1>サインイン</h1>
      <p class="login-desc">メールアドレスとパスワードを入力してください</p>

      <form action="./dashboard.html" method="get">
        <div class="form-group">
          <label class="form-label" for="email">メールアドレス</label>
          <input
            class="form-control"
            type="text"
            id="email"
            name="email"
            placeholder="ユーザIDまたはメールアドレス"
            autocomplete="email"
            aria-required="true"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <div class="password-wrapper">
            <input
              class="form-control"
              type="password"
              id="password"
              name="password"
              placeholder="パスワードを入力"
              autocomplete="current-password"
              aria-required="true"
            >
            <button
              type="button"
              class="password-toggle"
              id="pwToggle"
              aria-label="パスワードの表示切り替え"
            >👁</button>
          </div>
        </div>

        <button type="submit" class="btn-primary">ログイン</button>
        <a href="./dashboard.html" class="forgot-link">パスワードをお忘れの方</a>
      </form>

      <div class="demo-note">
        <strong>📌 デモ用ログイン情報</strong>
        メール: yamada@library.example.com<br>
        パスワード: password123
      </div>
    </div>

    <p class="login-footer">© 2024 LibraryMS. All rights reserved.</p>
  </div>

  <script>
    const pwToggle = document.getElementById('pwToggle');
    const pwInput = document.getElementById('password');
    pwToggle.addEventListener('click', () => {
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        pwToggle.textContent = '🙈';
        pwToggle.setAttribute('aria-label', 'パスワードを非表示');
      } else {
        pwInput.type = 'password';
        pwToggle.textContent = '👁';
        pwToggle.setAttribute('aria-label', 'パスワードを表示');
      }
    });
  </script>
</body>
</html>
